<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Your Name — Portfolio</title>
<meta name="description" content="Personal site — background, education and work." />

<!-- Fonts (loaded from Google, no setup needed) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Playfair+Display:wght@500;600;700;800&display=swap" rel="stylesheet">

<style>
  /* ============================================================
     THEME — change these colors once and the whole site updates
     ============================================================ */
  /* LIGHT THEME (sage mist) — change these to recolor the light look */
  :root {
    --paper:   #e9efe8;   /* background */
    --ink:     #1e251f;   /* main text  */
    --muted:   #5f6960;   /* soft text  */
    --accent:  #2d6a4f;   /* highlight (forest green) */
    --line:    #d2dbd1;   /* hairlines  */
    --card:    #f5f8f4;   /* card panels */
    --maxw:    760px;     /* content width */
  }

  /* DARK THEME — applied when the toggle is on (or system prefers dark) */
  :root[data-theme="dark"] {
    --paper:   #14181a;
    --ink:     #e9e8e2;
    --muted:   #9a9b94;
    --accent:  #57b487;   /* brighter green so it reads on dark */
    --line:    #2a2f30;
    --card:    #1c2123;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Lora', Georgia, serif;
    font-size: 17px;
    line-height: 1.65;
    background-image: radial-gradient(transparent 1px, rgba(180,170,150,0.05) 1px);
    background-size: 4px 4px;
    -webkit-font-smoothing: antialiased;
    transition: background-color .3s ease, color .3s ease;
  }

  .wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 28px; }

  /* ---- entrance animation ---- */
  .reveal { opacity: 0; transform: translateY(16px); animation: rise 0.7s cubic-bezier(.2,.7,.2,1) forwards; }
  @keyframes rise { to { opacity: 1; transform: none; } }

  /* ===========================  HEADER  =========================== */
  header { padding: 14px 0 44px; }

  /* name block at the top-left, in normal flow (stacks cleanly on mobile) */
  .nameplate { padding-top: 56px; text-align: left; }
  .name {
    font-family: 'Playfair Display', Georgia, serif;
    font-weight: 700;
    font-size: clamp(26px, 6vw, 36px);
    line-height: 1.05;
    letter-spacing: -0.01em;
  }
  .name .accent { color: var(--accent); }

  /* name in your own language, under the name */
  .name-row { display: flex; align-items: center; justify-content: flex-start; gap: 10px; margin-top: 6px; flex-wrap: wrap; }
  .name-native {
    font-family: 'Playfair Display', Georgia, serif;
    font-weight: 500;
    font-size: 15px;
    color: var(--muted);
    line-height: 1.1;
  }
  /* speaker button that plays the name pronunciation */
  .pronounce {
    display: inline-flex; align-items: center; justify-content: center;
    width: 30px; height: 30px; flex: none;
    border: 1.5px solid var(--line); border-radius: 50%;
    background: var(--card); color: var(--ink); cursor: pointer;
    transition: color .2s, background .2s, border-color .2s, transform .2s;
  }
  .pronounce:hover { color: #fff; background: var(--accent); border-color: var(--accent); }
  .pronounce.playing { color: #fff; background: var(--accent); border-color: var(--accent); }
  .pronounce svg { width: 15px; height: 15px; }
  .pronounce[hidden] { display: none; }

  /* light/dark toggle, pinned top-right */
  .theme-toggle {
    position: fixed; top: 18px; right: 18px; z-index: 10;
    width: 44px; height: 44px;
    border: 1.5px solid var(--line); border-radius: 50%;
    background: var(--card); color: var(--ink); cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    transition: color .2s, background .2s, border-color .2s, transform .2s;
  }
  .theme-toggle:hover { border-color: var(--accent); color: var(--accent); transform: rotate(-15deg); }
  .theme-toggle svg { width: 20px; height: 20px; }
  /* show the right icon for each mode */
  .theme-toggle .moon { display: none; }
  :root[data-theme="dark"] .theme-toggle .moon { display: block; }
  :root[data-theme="dark"] .theme-toggle .sun  { display: none; }
  .tagline { margin-top: 12px; font-size: clamp(17px, 2.5vw, 20px); color: var(--muted); max-width: 52ch; }

  .contact { margin-top: 18px; display: flex; flex-wrap: wrap; gap: 12px; }
  .contact a {
    display: inline-flex; align-items: center; justify-content: center;
    width: 46px; height: 46px;
    border: 1.5px solid var(--line); border-radius: 50%;
    color: var(--ink); background: var(--card);
    transition: color .2s, border-color .2s, transform .2s, background .2s;
  }
  .contact a:hover { color: #fff; background: var(--accent); border-color: var(--accent); transform: translateY(-3px); }
  .contact a svg { width: 21px; height: 21px; }
  .contact a[hidden] { display: none; }

  /* ===========================  SECTIONS (tiles)  =========================== */
  section {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 28px;
    margin-bottom: 18px;
  }
  .section-label {
    font-family: 'Lora', Georgia, serif;
    font-weight: 600; font-size: 13px; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--accent); margin-bottom: 20px;
  }
  .lede { font-size: 19px; line-height: 1.65; }

  /* ---- timeline entry (jobs + schools share this) ---- */
  .entry { margin-bottom: 34px; }
  .entry:last-child { margin-bottom: 0; }
  .entry-top { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  .entry-title { font-family: 'Playfair Display', Georgia, serif; font-weight: 600; font-size: 22px; line-height: 1.2; }
  .entry-org { color: var(--accent); font-weight: 600; }
  .entry-date { font-size: 14px; color: var(--muted); white-space: nowrap; }
  .entry-desc { margin-top: 8px; color: var(--muted); }

  /* ---- work cards ---- */
  .work-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px; }
  .card {
    background: var(--paper); border: 1px solid var(--line); border-radius: 14px;
    padding: 24px; transition: transform .2s ease, box-shadow .2s ease;
    text-decoration: none; color: inherit; display: block;
  }
  .card:hover { transform: translateY(-4px); box-shadow: 0 14px 30px -18px rgba(50,40,20,.4); }
  .card h3 { font-family: 'Playfair Display', Georgia, serif; font-weight: 600; font-size: 20px; margin-bottom: 6px; }
  .card p { color: var(--muted); font-size: 15px; }
  .card .tag { display: inline-block; margin-top: 14px; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); font-weight: 600; }

  /* ---- publications: collapsible panel + paper list ---- */
  .pub-panel { border: 1px solid var(--line); border-radius: 14px; background: var(--paper); overflow: hidden; }
  .pub-panel > summary {
    list-style: none; cursor: pointer; padding: 16px 20px;
    display: flex; align-items: center; justify-content: space-between;
    font-family: 'Playfair Display', Georgia, serif; font-weight: 600; font-size: 18px;
  }
  .pub-panel > summary::-webkit-details-marker { display: none; }
  .pub-panel > summary .chev { width: 20px; height: 20px; transition: transform .25s ease; color: var(--accent); }
  .pub-panel[open] > summary .chev { transform: rotate(180deg); }
  .pub-list { padding: 0 20px 8px; }
  .pub { padding: 16px 0; border-top: 1px solid var(--line); }
  .pub:first-child { border-top: none; }
  .pub-title { font-weight: 600; }
  .pub-title a { color: var(--ink); text-decoration: none; border-bottom: 1.5px solid var(--accent); padding-bottom: 1px; transition: color .2s; }
  .pub-title a:hover { color: var(--accent); }
  .pub-meta { color: var(--muted); font-size: 15px; margin-top: 4px; }
  .pub-meta .venue { color: var(--accent); }

  /* ---- hobby photo gallery ---- */
  .photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; }
  .photo {
    position: relative; border-radius: 14px; overflow: hidden;
    aspect-ratio: 4 / 3; background: var(--line);
    border: 1px solid var(--line);
  }
  .photo img {
    width: 100%; height: 100%; object-fit: cover; display: block;
    transition: transform .4s ease;
  }
  .photo:hover img { transform: scale(1.06); }
  .photo figcaption {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 22px 14px 12px;
    font-weight: 600; font-size: 15px; color: #fff;
    background: linear-gradient(transparent, rgba(20,16,10,.72));
  }

  footer { padding: 24px 4px 70px; color: var(--muted); font-size: 14px; }

  /* tighten everything so it packs into a small screen */
  @media (max-width: 560px) {
    body { font-size: 16px; }
    .wrap { padding: 0 16px; }
    section { padding: 20px; margin-bottom: 14px; }
    .nameplate { padding-top: 48px; }
    .entry-top { gap: 4px; }
    .work-grid { grid-template-columns: 1fr; }
    .photo-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
  }

  /* message shown if the JSON can't load */
  .loaderror { padding: 80px 0; color: var(--accent); }
</style>
<script>
  // Apply the saved/preferred theme immediately, before the page paints.
  (function () {
    var saved = localStorage.getItem('theme');
    var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    var theme = saved || (prefersDark ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>
</head>

<div class="wrap">

<script>
  // ============================================================
  // Fills the page from the content/ files. You normally never
  // need to touch this file — just edit the files in content/.
  // ============================================================
  document.getElementById('year').textContent = new Date().getFullYear();

  // dark-mode toggle: flip the theme and remember the choice
  document.getElementById('theme-toggle').addEventListener('click', function () {
    var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('theme', next);
  });

  // small helper: build one timeline entry (used for jobs + schools)
  function entryEl(item) {
    const wrap = document.createElement('div');
    wrap.className = 'entry';
    wrap.innerHTML =
      '<div class="entry-top">' +
        '<div class="entry-title"></div>' +
        '<div class="entry-date"></div>' +
      '</div>' +
      '<p class="entry-desc"></p>';
    const title = wrap.querySelector('.entry-title');
    title.textContent = item.title + ' ';
    if (item.org) {
      const org = document.createElement('span');
      org.className = 'entry-org';
      org.textContent = '· ' + item.org;
      title.appendChild(org);
    }
    wrap.querySelector('.entry-date').textContent = item.date || '';
    wrap.querySelector('.entry-desc').textContent = item.desc || '';
    return wrap;
  }

  // build one project card
  function cardEl(item) {
    const card = document.createElement('a');
    card.className = 'card';
    if (item.link) { card.href = item.link; card.target = '_blank'; card.rel = 'noopener'; }
    const h3 = document.createElement('h3'); h3.textContent = item.name;
    const p = document.createElement('p'); p.textContent = item.desc || '';
    card.appendChild(h3); card.appendChild(p);
    if (item.link) {
      const tag = document.createElement('span');
      tag.className = 'tag'; tag.textContent = 'View →';
      card.appendChild(tag);
    }
    return card;
  }

  // build one publication row
  function pubEl(item) {
    const row = document.createElement('div');
    row.className = 'pub';
    const title = document.createElement('div');
    title.className = 'pub-title';
    if (item.link) {
      const a = document.createElement('a');
      a.href = item.link; a.target = '_blank'; a.rel = 'noopener';
      a.textContent = item.title;
      title.appendChild(a);
    } else {
      title.textContent = item.title;
    }
    row.appendChild(title);
    if (item.authors) {
      const au = document.createElement('div');
      au.className = 'pub-meta'; au.textContent = item.authors;
      row.appendChild(au);
    }
    if (item.venue || item.year) {
      const vm = document.createElement('div');
      vm.className = 'pub-meta';
      const v = document.createElement('span');
      v.className = 'venue'; v.textContent = item.venue || '';
      vm.appendChild(v);
      vm.appendChild(document.createTextNode((item.venue && item.year ? ' · ' : '') + (item.year || '')));
      row.appendChild(vm);
    }
    return row;
  }

  // build one hobby photo tile
  function photoEl(item) {
    const fig = document.createElement('figure');
    fig.className = 'photo';
    const img = document.createElement('img');
    img.src = item.photo;
    img.alt = item.caption || '';
    img.loading = 'lazy';
    fig.appendChild(img);
    if (item.caption) {
      const cap = document.createElement('figcaption');
      cap.textContent = item.caption;
      fig.appendChild(cap);
    }
    return fig;
  }

  // sets a contact icon's link, or hides it if blank
  function setContact(id, href) {
    const el = document.getElementById(id);
    if (href) { el.href = href; el.hidden = false; }
  }

  function render(data) {
    // header
    document.title = (data.name + ' ' + (data.nameAccent || '')).trim() + ' — Portfolio';
    const nameEl = document.getElementById('name');
    nameEl.textContent = data.name + ' ';
    if (data.nameAccent) {
      const span = document.createElement('span');
      span.className = 'accent';
      span.textContent = data.nameAccent;
      nameEl.appendChild(span);
    }
    document.getElementById('tagline').textContent = data.tagline || '';
    document.getElementById('footer-name').textContent = (data.name + ' ' + (data.nameAccent || '')).trim();

    // name in your own language (smaller, under the main name)
    const nativeEl = document.getElementById('name-native');
    if (data.nameNative) {
      nativeEl.textContent = data.nameNative;
    } else {
      nativeEl.style.display = 'none';
    }

    // speaker button: plays the audio file of your name, if one is set
    const pron = document.getElementById('pronounce');
    if (data.namePronunciation) {
      const audio = new Audio(data.namePronunciation);
      pron.hidden = false;
      pron.addEventListener('click', function () {
        audio.currentTime = 0;
        pron.classList.add('playing');
        audio.play().catch(function () {});
      });
      audio.addEventListener('ended', function () { pron.classList.remove('playing'); });
    }

    // contacts
    const c = data.contacts || {};
    setContact('c-email', c.email ? 'mailto:' + c.email : '');
    setContact('c-github', c.github);
    setContact('c-linkedin', c.linkedin);
    setContact('c-resume', c.resume);

    // about
    document.getElementById('about').textContent = data.about || '';

    // experience + education
    (data.experience || []).forEach(function (it) { document.getElementById('experience').appendChild(entryEl(it)); });
    (data.education || []).forEach(function (it) { document.getElementById('education').appendChild(entryEl(it)); });

    // publications: scholar profile icons + collapsible paper list
    const sl = data.scholarLinks || {};
    setContact('p-scholar', sl.googleScholar);
    setContact('p-semantic', sl.semanticScholar);
    setContact('p-orcid', sl.orcid);
    const papers = data.publications || [];
    const hasLinks = sl.googleScholar || sl.semanticScholar || sl.orcid;
    if (papers.length) {
      document.getElementById('pub-summary').textContent = 'Papers (' + papers.length + ')';
      papers.forEach(function (p) { document.getElementById('publications').appendChild(pubEl(p)); });
    } else {
      document.getElementById('pub-panel').style.display = 'none';   // no papers: drop the panel
    }
    if (!papers.length && !hasLinks) {
      document.getElementById('pub-panel').closest('section').style.display = 'none';
    }

    // projects (Prior Work)
    (data.projects || []).forEach(function (it) { document.getElementById('work').appendChild(cardEl(it)); });

    // hobbies — hide the whole section if there are none
    const hobbies = data.hobbies || [];
    if (hobbies.length) {
      hobbies.forEach(function (it) { document.getElementById('hobbies').appendChild(photoEl(it)); });
    } else {  
      document.getElementById('hobbies').closest('section').style.display = 'none';
    }
  }

  // the content/ files set window.SITE_CONTENT
  if (window.SITE_CONTENT) {
    render(window.SITE_CONTENT);
  } else {
    document.querySelector('.wrap').innerHTML =
      '<div class="loaderror">Could not load the <b>content/</b> files. ' +
      'Make sure the content folder sits in the same place as index.html.</div>';
  }
</script>
</body>
</html>
